name: Checks

on:
  push:
    branches: [main]
  pull_request:
  # release.yml reruns these on the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  manifest:
    name: Validate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # tomllib is stdlib only on Python 3.11+; pin an interpreter that has it
      # rather than relying on the runner's default system Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse aoe-plugin.toml
        run: |
          python3 - <<'PY'
          import tomllib
          with open("aoe-plugin.toml", "rb") as f:
              tomllib.load(f)
          print("aoe-plugin.toml parses as TOML")
          PY
      - name: Test the featured-index updater
        run: |
          pip install tomlkit==0.15.2
          python3 -m unittest discover -s scripts

  node:
    name: Lint, type-check, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Check committed dist/ matches the build
        run: |
          git add --intent-to-add dist
          git diff --exit-code -- dist || {
            echo "::error::dist/ is out of date; run npm run build and commit the result."
            exit 1
          }
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
