id = "agent-of-empires.kanban"
name = "Board"
version = "0.0.1"
# Page slot lands in core with api_version 16 (agent-of-empires/agent-of-empires#4459).
api_version = 16
# Host range tested; 1.20.0 is the first core release with the page slot.
aoe_version = ">=1.20.0, <2.0.0"
description = "Kanban Board of your Sessions, with Stage and Signal columns."
capabilities = ["runtime.worker", "session.read", "session.write"]

[[ui]]
slot = "page"
id = "board"
title = "Board"
entry = "dist/index.html"

# dist/ is committed, so install needs no build step; only `node` on PATH.
[runtime]
kind = "command"
command = ["node", "dist/worker.js"]
system = true
