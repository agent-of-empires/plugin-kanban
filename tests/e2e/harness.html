<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Board harness</title>
  </head>
  <body>
    <!-- Mirrors how the dashboard hosts plugin pages: by URL with a nonce fragment, scripts only, opaque origin. -->
    <iframe id="page" sandbox="allow-scripts" style="width: 100%; height: 90vh"></iframe>
    <script>
      // A fake dashboard side of bridge v1. The test calls startPage(fixtures)
      // and reads window.opened for openSession calls.
      const NONCE = "test-nonce";
      const frame = document.getElementById("page");
      let port = null;
      let fixtures = null;
      window.opened = [];

      const send = (msg) => port.postMessage({ aoeBridge: 1, ...msg });
      function answer(method, params) {
        if (method === "sessions.list") return { result: fixtures.sessions };
        if (method === "plugins.uiState") return { result: { entries: fixtures.entries, notifications: [] } };
        if (method === "openSession") {
          window.opened.push(params.id);
          return { result: null };
        }
        return { error: { code: "unknown_method", message: `Unknown method ${method}.` } };
      }

      window.addEventListener("message", (event) => {
        const msg = event.data;
        if (event.source !== frame.contentWindow || port || msg?.method !== "ready" || msg.params?.nonce !== NONCE) return;
        port = event.ports[0];
        port.onmessage = ({ data }) => send({ id: data.id, ...answer(data.method, data.params) });
        send({ id: msg.id, result: null });
        send({ event: "context", data: fixtures.context });
        send({ event: "theme", data: fixtures.theme });
      });

      window.startPage = (f) => {
        fixtures = f;
        frame.src = `/dist/index.html#${NONCE}`;
      };
      window.pushTheme = (theme) => send({ event: "theme", data: theme });
    </script>
  </body>
</html>
