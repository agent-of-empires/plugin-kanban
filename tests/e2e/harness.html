<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- As the dashboard has, so a phone viewport lays the host out at device width. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board harness</title>
  </head>
  <body>
    <!-- Mirrors how the dashboard hosts plugin pages: by URL with a nonce fragment, scripts only, opaque origin. -->
    <iframe id="page" sandbox="allow-scripts" style="width: 100%; height: 90vh"></iframe>
    <script>
      // A fake dashboard side of bridge v1. The test calls startPage(fixtures)
      // and reads window.opened for openSession calls and window.actions for
      // worker actions. config.set lands in the page snapshot, as the worker
      // would publish it; window.fixtures() returns that state for a reload.
      // stage.set lands only when the test calls window.publishStage, so a
      // test sees the optimistic move before the worker confirms it.
      const NONCE = "test-nonce";
      let frame = document.getElementById("page");
      let port = null;
      let fixtures = null;
      window.opened = [];
      window.actions = [];
      window.fixtures = () => fixtures;

      const send = (msg) => port.postMessage({ aoeBridge: 1, ...msg });
      function answer(method, params) {
        if (method === "sessions.list") return { result: fixtures.sessions };
        if (method === "plugins.uiState") return { result: { entries: fixtures.entries, notifications: [] } };
        if (method === "openSession") {
          window.opened.push(params.id);
          return { result: null };
        }
        if (method === "action") {
          if (fixtures.rejectActions) return { error: { code: "failed", message: "worker unreachable" } };
          window.actions.push(params);
          if (params.method === "config.set") {
            const { pluginId, pageId } = fixtures.context;
            const own = (e) => e.plugin_id === pluginId && e.slot === "page" && e.id === pageId && !e.session_id;
            let entry = fixtures.entries.find(own);
            if (!entry) fixtures.entries.push((entry = { plugin_id: pluginId, slot: "page", id: pageId, payload: {} }));
            entry.payload = { ...entry.payload, config: params.params.config };
          }
          return { result: { baselineRevision: window.actions.length } };
        }
        return { error: { code: "unknown_method", message: `Unknown method ${method}.` } };
      }

      window.addEventListener("message", (event) => {
        const msg = event.data;
        if (event.source !== frame.contentWindow || port || msg?.method !== "ready" || msg.params?.nonce !== NONCE) return;
        port = event.ports[0];
        port.onmessage = ({ data }) => send({ id: data.id, ...answer(data.method, data.params) });
        send({ id: msg.id, result: null });
        send({ event: "context", data: fixtures.context });
        send({ event: "theme", data: fixtures.theme });
      });

      window.startPage = (f) => {
        fixtures = f;
        // A fresh frame opens a fresh bridge, like reopening the page.
        const next = frame.cloneNode();
        next.removeAttribute("src");
        frame.replaceWith(next);
        frame = next;
        port = null;
        frame.src = `/dist/index.html#${NONCE}`;
      };
      window.pushTheme = (theme) => send({ event: "theme", data: theme });
      window.publishStage = (sessionId, columnId) => {
        const { pluginId, pageId } = fixtures.context;
        const entry = fixtures.entries.find((e) => e.plugin_id === pluginId && e.slot === "page" && e.id === pageId);
        entry.payload.stages[sessionId] = columnId;
      };
    </script>
  </body>
</html>
